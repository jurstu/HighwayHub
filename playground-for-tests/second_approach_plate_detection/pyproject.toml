[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpr"
version = "0.1.0"
description = "Classical OpenCV license-plate detection with EasyOCR recognition"
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "torch==2.5.1+cpu",
    "torchvision==0.20.1+cpu",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
alpr = "alpr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alpr"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
